# ld65 linker config for suboros - SXROM (MMC1)
# PRG ROM: 8 x 16KB = 128KB
# PRG RAM: 32KB at $6000-$7FFF (8KB visible at a time via MMC1 bank switch)
# CHR RAM: 8KB (written at runtime, not in ROM)

SYMBOLS {
    # Required by none.lib's crt0 for stack init (we do this ourselves in startup.asm)
    __STACKSTART__: type = weak, value = $0800;
}

MEMORY {
    # iNES header - 16 bytes at start of file
    HEADER: start=$0000, size=$10, file=%O, fill=yes;

    # PRG ROM banks 0-6 ($FF fill), mapped to $8000-$BFFF via MMC1
    # Use addresses above 16-bit space to avoid collision; no segments placed here.
    FILL0:  start=$10000, size=$4000, file=%O, fill=yes, fillval=$FF;
    FILL1:  start=$14000, size=$4000, file=%O, fill=yes, fillval=$FF;
    FILL2:  start=$18000, size=$4000, file=%O, fill=yes, fillval=$FF;
    FILL3:  start=$1C000, size=$4000, file=%O, fill=yes, fillval=$FF;
    FILL4:  start=$20000, size=$4000, file=%O, fill=yes, fillval=$FF;
    FILL5:  start=$24000, size=$4000, file=%O, fill=yes, fillval=$FF;
    FILL6:  start=$28000, size=$4000, file=%O, fill=yes, fillval=$FF;
    # PRG ROM bank 7: fixed at $C000-$FFFF, contains all code/data/vectors
    PRG_FIXED: start=$C000, size=$4000, file=%O, fill=yes, fillval=$FF;

    # --- Runtime memory (not in file) ---

    ZP:        start=$00,   size=$100,  type=rw, file="";
    RAM:       start=$0200, size=$400,  type=rw, file="";
    PPU_QUEUE: start=$0600, size=$100,  type=rw, file="";
    # $0700-$07FF: free headroom under CC65 software stack ($0800 grows down).
}

SEGMENTS {
    HEADER:  load=HEADER,    type=ro;

    STARTUP:   load=PRG_FIXED, type=ro, optional=yes;
    CODE:      load=PRG_FIXED, type=ro, define=yes;
    RODATA:    load=PRG_FIXED, type=ro;
    ONCE:      load=PRG_FIXED, type=ro, optional=yes;
    DATA:      load=PRG_FIXED, type=ro, optional=yes;
    VECTORS:   load=PRG_FIXED, type=ro, start=$FFFA;
    PPU_QUEUE: load=PPU_QUEUE, type=bss, define=yes;

    # FS data banks (banks 0-6, switchable at $8000-$BFFF)
    BANK0: load=FILL0, type=ro, optional=yes;
    BANK1: load=FILL1, type=ro, optional=yes;
    BANK2: load=FILL2, type=ro, optional=yes;
    BANK3: load=FILL3, type=ro, optional=yes;
    BANK4: load=FILL4, type=ro, optional=yes;
    BANK5: load=FILL5, type=ro, optional=yes;
    BANK6: load=FILL6, type=ro, optional=yes;

    ZEROPAGE: load=ZP,  type=zp;
    BSS:      load=RAM, type=bss, define=yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
