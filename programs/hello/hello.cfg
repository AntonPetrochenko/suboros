MEMORY {
    PRG:  start = $8000, size = $4000, fill = yes, fillval = $FF, file = %O;
    ZP:   start = $00,   size = $100,  type = rw,  file = "";
}
SEGMENTS {
    CODE:     load = PRG, type = ro;
    RODATA:   load = PRG, type = ro, optional = yes;
    ZEROPAGE: load = ZP,  type = zp, optional = yes;
}
